name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Typecheck + build + unit/e2e tests
  # ---------------------------------------------------------------------------
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run tests (e2e against built-in demo API)
        run: npm test
        timeout-minutes: 5

  # ---------------------------------------------------------------------------
  # Job 2: Smoke-test the packed npm artifact
  #
  # Packs what would be published to npm, installs it into a temp directory,
  # and runs the CLI from the *installed* package — catching stale dist/,
  # missing files in "files", or broken entry points before they reach users.
  # ---------------------------------------------------------------------------
  artifact-smoke:
    name: Artifact smoke test
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Pack the npm artifact
        run: npm pack --pack-destination /tmp

      - name: Install the packed artifact into a clean directory
        run: |
          mkdir -p /tmp/smoke-test
          cd /tmp/smoke-test
          npm init -y
          TARBALL=$(ls /tmp/edgefuzz-*.tgz)
          npm install "$TARBALL"

      - name: Verify --version works from the installed package
        run: npx --prefix /tmp/smoke-test edgefuzz --version

      - name: Verify --help works from the installed package
        run: npx --prefix /tmp/smoke-test edgefuzz --help

      - name: Verify --demo exits with code 1 (crashes found)
        run: |
          set +e
          npx --prefix /tmp/smoke-test edgefuzz --demo --ci
          EXIT_CODE=$?
          set -e
          if [ "$EXIT_CODE" -ne "1" ]; then
            echo "Expected exit code 1 (crashes found), got $EXIT_CODE"
            exit 1
          fi
          echo "✓ --demo exited with code 1 as expected"
