name: EdgeFuzz API Audit

# This workflow shows how to use EdgeFuzz as a CI/CD quality gate.
# Copy this into your own project and configure the inputs below.

on:
  pull_request:
    branches: [main]

jobs:
  api-audit:
    name: EdgeFuzz API Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      # Start your API server here. Example for a Node.js app:
      # - name: Start API server
      #   run: npm start &
      #   env:
      #     NODE_ENV: test

      # Wait for the server to be ready
      # - name: Wait for server
      #   run: npx wait-on http://localhost:8080/health --timeout 30000

      - name: Run EdgeFuzz Audit
        run: |
          npx edgefuzz@latest \
            http://localhost:8080 \
            http://localhost:8080/openapi.json \
            --ci \
            --concurrency 10 \
            --output edgefuzz-report.json
        # Exit code 1 = crashes found → CI step fails → PR is blocked
        # Uncomment the line below to NOT fail CI (report-only mode):
        # continue-on-error: true
        env:
          # Optional: enable LLM fix suggestions
          # OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_KEY: ""

      - name: Upload EdgeFuzz Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edgefuzz-report
          path: edgefuzz-report.json
          retention-days: 30
